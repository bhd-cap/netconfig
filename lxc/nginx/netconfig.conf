# NetConfig Backup - single origin: the compiled UI plus a proxy to the API.
#
# Serving both from one origin means the browser never makes a cross-origin
# request, so CORS is not involved at all and the bundle is built with a
# relative API base (VITE_API_URL=/api/v1).

upstream netconfig_api {
    server 127.0.0.1:@API_PORT@;
    # Reuse connections rather than opening a new one per request.
    keepalive 16;
}

# Bound how fast a single client can hit the API. Backups and comparisons are
# expensive, and the burst allows for a dashboard loading several panels at
# once.
limit_req_zone $binary_remote_addr zone=netconfig_api:10m rate=20r/s;

server {
    listen @HTTP_PORT@;
@LISTEN6@
    server_name _;

    root @APP_DIR@/frontend/dist;
    index index.html;

    # Configuration files can be large; the API also gzips its own responses.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    access_log /var/log/nginx/netconfig.access.log;
    error_log  /var/log/nginx/netconfig.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API ----------------------------------------------------------
    location /api/ {
        limit_req zone=netconfig_api burst=40 nodelay;

        proxy_pass http://netconfig_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A bulk backup over slow SSH sessions can take a while to answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # The API already gzips; don't decompress and recompress in between.
        gzip off;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # ---- API documentation --------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://netconfig_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- static assets -------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
