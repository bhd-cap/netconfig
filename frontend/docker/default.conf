# Static asset server for the built React application.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. Hashed bundles are also served pre-compressed when
    # a .gz sibling exists, so nginx spends no CPU re-compressing them.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;
    gzip_static on;

    # Vite emits content-hashed filenames, so these can be cached immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening for a page that only ever loads its own assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
